name: Build and Publish ViewNyang

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore stable signing material
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view viewnyang-signing >/dev/null 2>&1; then
            gh release download viewnyang-signing --pattern "viewnyang-release.jks" --pattern "viewnyang-signing.env" --clobber
          else
            PASS="$(openssl rand -hex 32)"
            keytool -genkeypair -keystore viewnyang-release.jks -storepass "$PASS" -keypass "$PASS" -alias viewnyang -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=ViewNyang,O=ViewNyang,C=KR"
            printf "VIEWNYANG_KEYSTORE_PASSWORD=%s\nVIEWNYANG_KEY_PASSWORD=%s\n" "$PASS" "$PASS" > viewnyang-signing.env
            gh release create viewnyang-signing --draft --title "ViewNyang signing material" --notes "Private build material. Keep this release as draft."
            gh release upload viewnyang-signing viewnyang-release.jks viewnyang-signing.env
          fi

          test -s viewnyang-release.jks
          test -s viewnyang-signing.env
          cat viewnyang-signing.env >> "$GITHUB_ENV"
          echo "VIEWNYANG_KEYSTORE_PATH=$GITHUB_WORKSPACE/viewnyang-release.jks" >> "$GITHUB_ENV"
          echo "VIEWNYANG_KEY_ALIAS=viewnyang" >> "$GITHUB_ENV"

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ViewNyang-v0.7.2.apk
          test -s ViewNyang-v0.7.2.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -printcert -jarfile ViewNyang-v0.7.2.apk
          sha256sum ViewNyang-v0.7.2.apk

      - name: Publish release APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view v0.7.2 >/dev/null 2>&1; then
            gh release create v0.7.2 --title "ViewNyang v0.7.2" --notes "Google 검색 주소창 · 브라우저 안전영역 · 읽기 잠금 · 앱 자체 업데이트"
          fi
          gh release upload v0.7.2 ViewNyang-v0.7.2.apk --clobber

      - name: Write updater metadata
        shell: bash
        run: |
          set -euo pipefail
          cp ViewNyang-v0.7.2.apk ViewNyang-latest.apk
          SHA256="$(sha256sum ViewNyang-latest.apk | awk '{print $1}')"
          cat > latest.json <<EOF
          {
            "versionCode": 25,
            "versionName": "0.7.2",
            "apkUrl": "https://raw.githubusercontent.com/cptu527/hanview-android/main/ViewNyang-latest.apk",
            "sha256": "$SHA256",
            "notes": "회차간 URL 이동 기본 차단 · 실제 텍스트 링크 탭만 회차 이동 허용 · 이미지 탭 다음화 이동 차단"
          }
          EOF

      - name: Commit updater metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json ViewNyang-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish ViewNyang updater metadata [skip ci]"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViewNyang-v0.7.2-apk
          path: ViewNyang-v0.7.2.apk
